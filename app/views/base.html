<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi App Flask{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
</head>
<body>
    <header class="navbar">
        <a class="brand" href="{{ url_for('main.index') }}">
            <span class="dot"></span>
            To Do App
        </a>
        <div class="navbar-actions">
            <div class="user-chip">
                <div class="avatar">EP</div>
                <span>Edson Pardo</span>
            </div>
            <button class="menu-toggle" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <aside class="sidebar">
        <p class="section-title">Menú</p>
        <a href="{{ url_for('main.index') }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Inicio
        </a>
        <a href="{{ url_for('user.list_users') }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Usuarios
        </a>
    </aside>

    <div class="overlay"></div>

    <div class="modal-overlay" id="confirm-modal" hidden>
        <div class="modal modal-confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
            <div class="modal-header">
                <h2 id="confirm-title">Confirmar</h2>
                <button type="button" class="modal-close" aria-label="Cerrar" data-confirm-close>&times;</button>
            </div>
            <div class="modal-body">
                <p id="confirm-message"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" data-confirm-close>Cancelar</button>
                <button type="button" class="btn btn-danger-solid" id="confirm-accept">Eliminar</button>
            </div>
        </div>
    </div>

    <main class="main">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <script id="flash-messages" type="application/json">{{ messages|tojson }}</script>
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
